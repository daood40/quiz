name: Deploy demo to GitHub Pages

# Publishes https://daood40.github.io/quiz/ on every push to the default
# branch (main, or claude/quiz-platform-setup-fsywh2 while it is the default).
on:
  push:
    branches:
      - main
      - claude/quiz-platform-setup-fsywh2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Two modes, chosen by one repository variable (Settings → Secrets and variables → Actions → Variables):
      #   VITE_API_BASE unset  → static demo (in-browser engine + bundled bank)
      #   VITE_API_BASE set    → full app on Pages talking to your hosted API, e.g. https://quiz-api.onrender.com/api/v1
      - name: Build web (demo, or full app when VITE_API_BASE is set)
        run: npm run build --workspace=web
        env:
          VITE_DEMO: ${{ vars.VITE_API_BASE == '' && '1' || '' }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: SPA fallback for deep links
        run: cp web/dist/index.html web/dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
