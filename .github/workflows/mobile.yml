name: Mobile (Android AAB · iOS)

# Store builds of the Capacitor shells around the production web bundle.
#   Repository variable  MOBILE_API_BASE   → https://<your-api>/api/v1  (defaults to the Render blueprint URL)
#   Android signing      ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (secrets)
#   iOS signing          IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD, IOS_PROVISION_PROFILE_BASE64, IOS_TEAM_ID (secrets)
# Without signing secrets the jobs still compile everything (unsigned AAB/APK, simulator build) so CI proves the projects build.

on:
  push:
    branches: ['**']
    paths: ['web/**', '.github/workflows/mobile.yml', 'package.json', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: read

env:
  MOBILE_API_BASE: ${{ vars.MOBILE_API_BASE || 'https://quiz-api.onrender.com/api/v1' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Version from package.json
        id: ver
        run: |
          v=$(node -p "require('./package.json').version")
          IFS=. read -r a b c <<< "$v"
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "code=$((a*10000 + b*100 + c))" >> "$GITHUB_OUTPUT"
      - name: Build web bundle for the store app
        run: npm run build --workspace=web
        env:
          VITE_API_BASE: ${{ env.MOBILE_API_BASE }}
          VITE_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
      - name: Sync Capacitor
        run: npx --workspace=web cap sync android
      - name: Decode upload keystore (if configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build release AAB + APK
        working-directory: web/android
        run: ./gradlew --no-daemon bundleRelease assembleRelease
        env:
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
          APP_VERSION_CODE: ${{ steps.ver.outputs.code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Summary
        run: |
          {
            echo "### Android ${{ steps.ver.outputs.name }} (versionCode ${{ steps.ver.outputs.code }})"
            echo "- API: \`${{ env.MOBILE_API_BASE }}\`"
            if [ -n "$ANDROID_KEYSTORE_PATH" ]; then echo "- Signed with the upload key → ready for Play Console"; else echo "- **Unsigned** (add ANDROID_KEYSTORE_* secrets) → Play Console will reject until signed"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ steps.ver.outputs.name }}
          path: |
            web/android/app/build/outputs/bundle/release/*.aab
            web/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version from package.json
        id: ver
        run: |
          v=$(node -p "require('./package.json').version")
          IFS=. read -r a b c <<< "$v"
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "code=$((a*10000 + b*100 + c))" >> "$GITHUB_OUTPUT"
      - name: Build web bundle for the store app
        run: npm run build --workspace=web
        env:
          VITE_API_BASE: ${{ env.MOBILE_API_BASE }}
          VITE_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
      - name: Sync Capacitor (pod install)
        run: npx --workspace=web cap sync ios
      - name: Compile (simulator, unsigned) — proves the project builds
        working-directory: web/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            MARKETING_VERSION=${{ steps.ver.outputs.name }} CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.code }} \
            CODE_SIGNING_ALLOWED=NO build | tail -30
      - name: Import signing certificate + profile (if configured)
        if: ${{ secrets.IOS_CERT_P12_BASE64 != '' }}
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
      - name: Archive + export IPA (if configured)
        if: ${{ secrets.IOS_CERT_P12_BASE64 != '' }}
        working-directory: web/ios/App
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION=${{ steps.ver.outputs.name }} CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.code }} \
            DEVELOPMENT_TEAM=${{ secrets.IOS_TEAM_ID }} archive | tail -20
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/ipa" | tail -20
      - uses: actions/upload-artifact@v4
        if: ${{ secrets.IOS_CERT_P12_BASE64 != '' }}
        with:
          name: ios-${{ steps.ver.outputs.name }}
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
      - name: Summary
        run: |
          {
            echo "### iOS ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})"
            echo "- API: \`${{ env.MOBILE_API_BASE }}\`"
            if [ -n "${{ secrets.IOS_CERT_P12_BASE64 }}" ]; then echo "- IPA exported for App Store Connect"; else echo "- Compiled for the simulator only (add IOS_* secrets to export a signed IPA)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
