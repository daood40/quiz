name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quiz_ci_password
          POSTGRES_DB: quiz_platform_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quiz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://quiz:quiz_ci_password@localhost:5432/quiz_platform_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enable PostgreSQL extensions
        run: |
          PGPASSWORD=quiz_ci_password psql -h localhost -U quiz -d quiz_platform_test \
            -c 'CREATE EXTENSION IF NOT EXISTS citext; CREATE EXTENSION IF NOT EXISTS pg_trgm;'
      - name: Typecheck (server + web)
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build (server + web)
        run: npm run build
      - name: Dependency audit (high+)
        run: npm audit --omit=dev --audit-level=high
