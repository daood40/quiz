# Render Blueprint: one web service (Docker) + managed PostgreSQL.
# Deploy: Render dashboard → New → Blueprint → this repo.
services:
  - type: web
    name: quiz-api
    runtime: docker
    plan: starter
    region: frankfurt   # closest Render region to North Africa / the Gulf (~60-110 ms)
    healthCheckPath: /ready   # DB + pool + jobs; /health is liveness only
    envVars:
      - key: NODE_ENV
        value: production
      - key: JOBS_ENABLED
        value: "true"
      - key: SEED_ON_BOOT
        value: "true"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: quiz-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: MAIL_PROVIDER
        sync: false
      - key: MAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ERROR_WEBHOOK_URL
        sync: false
databases:
  - name: quiz-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
