# Render Blueprint: one web service (Docker) + managed PostgreSQL.
# Deploy: Render dashboard → New → Blueprint → this repo.
services:
  - type: web
    name: quiz-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JOBS_ENABLED
        value: "true"
      - key: SEED_ON_BOOT
        value: "true"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: quiz-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
databases:
  - name: quiz-db
    plan: basic-256mb
    postgresMajorVersion: "16"
